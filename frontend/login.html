<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - MGI ERP / HRIS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Global Theme -->
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #0f2042 0%, #080f20 90%);
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      background-color: #ffffff;
      overflow: hidden;
    }

    .login-header {
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 2rem 2rem 1.5rem;
      text-align: center;
    }

    .login-brand-icon {
      width: 48px;
      height: 48px;
      background-color: var(--mgi-primary);
      color: #f59e0b;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(15, 32, 66, 0.2);
    }

    .login-body {
      padding: 2rem;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-icon">
          <i class="bi bi-buildings"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">MGI ERP System</h4>
        <p class="text-muted small mb-0">PT Montana Global Investama</p>
      </div>

      <div class="login-body">
        <!-- Error Alert Container -->
        <div id="loginAlert" class="alert alert-danger d-none align-items-center gap-2 p-2 mb-3 small" role="alert">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span id="loginAlertMsg">Invalid credentials</span>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
          <div class="mb-3">
            <label for="emailInput" class="form-label small fw-semibold text-secondary">Email Perusahaan</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="emailInput" placeholder="nama@mgi.co.id"
                required autofocus value="">
            </div>
          </div>

          <div class="mb-4">
            <label for="passwordInput" class="form-label small fw-semibold text-secondary">Kata Sandi</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="passwordInput"
                placeholder="••••••••" required value="">
              <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePasswordBtn"
                onclick="togglePasswordVisibility()">
                <i class="bi bi-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            <span id="btnText">Masuk ke Sistem</span>
            <i class="bi bi-arrow-right" id="btnIcon"></i>
          </button>
        </form>
      </div>

      <div class="card-footer bg-light text-center py-3 border-top">
        <span class="text-muted small">Hubungi <strong>IT Support</strong> jika mengalami kendala login</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="components/toast.js"></script>
  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('togglePasswordIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const alertBox = document.getElementById('loginAlert');
      const alertMsg = document.getElementById('loginAlertMsg');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');

      // Reset state
      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Memverifikasi...';
      btnIcon.classList.add('d-none');

      try {
        const res = await apiPost('/backend/api/auth/login.php', { email, password });
        if (res.success) {
          showToast(res.message || 'Kredensial valid!', 'success');
          // Simpan session status lokal
          if (res.data && res.data.user) {
            localStorage.setItem('mgi_user', JSON.stringify(res.data.user));
          }

          setTimeout(() => {
            if (res.data && res.data.must_change_password) {
              window.location.href = getAppUrl('/frontend/change-password.html');
            } else if (res.data && res.data.mfa_required) {
              window.location.href = res.data.mfa_setup
                ? getAppUrl('/frontend/mfa-setup.html')
                : getAppUrl('/frontend/mfa.html');
            } else {
              window.location.href = getAppUrl('/frontend/dashboard.html');
            }
          }, 800);
        } else {
          alertMsg.textContent = res.message || 'Email atau kata sandi tidak valid.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertMsg.textContent = 'Terjadi kesalahan sistem. Silakan coba lagi.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.textContent = 'Masuk ke Sistem';
        btnIcon.classList.remove('d-none');
      }
    }
  </script>
</body>

</html>
