<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGI ERP - Document Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
</head>
<body>
  <div id="app-wrapper">
    <!-- Sidebar -->
    <aside id="app-sidebar"></aside>

    <!-- Main Section -->
    <div id="app-main">
      <!-- Top Header Navbar -->
      <header id="app-header"></header>

      <!-- App Content Container -->
      <main class="app-content">
        <div class="mb-4">
            <a href="/frontend/pages/legal/documents.html" class="text-decoration-none fw-medium text-secondary">
                <i class="bi bi-arrow-left"></i> Back to Documents
            </a>
        </div>

        <div class="row">
            <!-- Details Card -->
            <div class="col-md-7 mb-4 mb-md-0">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold">Document Detail</h5>
                        <button class="btn btn-sm btn-outline-danger" id="btnArchive">Archive Document</button>
                    </div>
                    <div class="card-body" id="docDetailContent">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <div class="mt-2 text-muted">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Access Management Card -->
            <div class="col-md-5">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="mb-0 fw-bold">Manage Access</h5>
                    </div>
                    <div class="card-body bg-light rounded-bottom">
                        <form id="grantAccessForm" class="mb-0">
                            <h6 class="fw-bold mb-3">Grant Access</h6>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Roles (Hold Ctrl/Cmd to select multiple)</label>
                                <select id="accessRole" class="form-select border-0 shadow-sm" multiple required style="height: 130px;">
                                    <option value="">Select Role...</option>
                                    <option value="1">IT</option>
                                    <option value="2">HRGA</option>
                                    <option value="4">Finance</option>
                                    <option value="5">Business Development</option>
                                    <option value="6">PM</option>
                                    <option value="7">Admin</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Permission</label>
                                <select id="accessPermission" class="form-select border-0 shadow-sm" required>
                                    <option value="VIEW">View Only</option>
                                    <option value="VIEW_DOWNLOAD">View & Download</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Grant Access</button>
                        </form>
                    </div>
                </div>
                
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3">
                        <h6 class="mb-0 fw-bold">Shared With</h6>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="sharedList">
                            <li class="list-group-item text-center text-muted py-4">Loading...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../utils/roles.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/loading.js"></script>
  <script src="../../components/sidebar.js"></script>
  <script src="../../components/header.js"></script>

  <script>
    let currentUser = null;
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('id');

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await checkAuth();
        if (!currentUser) return;
        
        renderSidebar('legal_documents', currentUser);
        renderHeader(currentUser);

        if (!docId) {
            alert('No document selected.');
            window.location.href = getAppUrl('/frontend/pages/legal/documents.html');
            return;
        }

        await loadDocumentDetail();

        document.getElementById('grantAccessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const roleSelect = document.getElementById('accessRole');
            const roleIds = Array.from(roleSelect.selectedOptions).map(opt => parseInt(opt.value));
            const permission = document.getElementById('accessPermission').value;

            try {
                const res = await apiPost(`/backend/api/documents/access.php?id=${docId}`, { role_ids: roleIds, permission: permission });
                
                if (res.success) {
                    showToast('Success', 'Access granted successfully', 'success');
                    document.getElementById('grantAccessForm').reset();
                    loadDocumentDetail(); // reload
                } else {
                    showToast('Error', res.message, 'error');
                }
            } catch (err) {
                showToast('Error', 'Failed to grant access', 'error');
            }
        });

        document.getElementById('btnArchive').addEventListener('click', async () => {
            if (confirm('Are you sure you want to archive this document?')) {
                try {
                    const res = await sendRequest(`/backend/api/documents/archive.php?id=${docId}`, { method: 'PATCH' });
                    
                    if (res.success) {
                        showToast('Success', 'Document archived successfully', 'success');
                        setTimeout(() => {
                            window.location.href = getAppUrl('/frontend/pages/legal/documents.html');
                        }, 1000);
                    } else {
                        showToast('Error', res.message, 'error');
                    }
                } catch (err) {
                    showToast('Error', 'Failed to archive document', 'error');
                }
            }
        });
    });

    async function loadDocumentDetail() {
        try {
            const res = await apiGet(`/backend/api/documents/detail.php?id=${docId}`);
            
            if (res.success) {
                const doc = res.data;
                const sizeMb = (doc.file_size / (1024 * 1024)).toFixed(2);
                
                document.getElementById('docDetailContent').innerHTML = `
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-light p-3 rounded me-3 text-primary">
                            <i class="bi bi-file-earmark-text fs-1"></i>
                        </div>
                        <div>
                            <h4 class="mb-1 fw-bold">${doc.name}</h4>
                            <span class="badge bg-secondary">${doc.category}</span>
                            <span class="badge bg-info text-dark">${doc.status}</span>
                        </div>
                    </div>
                    <table class="table table-borderless table-sm">
                        <tr><th class="text-muted" style="width:150px;">Original File</th><td class="fw-medium">${doc.original_file_name}</td></tr>
                        <tr><th class="text-muted">Type</th><td class="fw-medium">${doc.file_extension.toUpperCase()} (${doc.mime_type})</td></tr>
                        <tr><th class="text-muted">Size</th><td class="fw-medium">${sizeMb} MB</td></tr>
                        <tr><th class="text-muted">Description</th><td class="fw-medium">${doc.description || '-'}</td></tr>
                        <tr><th class="text-muted">Date Uploaded</th><td class="fw-medium">${new Date(doc.created_at).toLocaleString('id-ID')}</td></tr>
                        <tr><th class="text-muted">Uploaded By</th><td class="fw-medium">${doc.uploaded_by.email}</td></tr>
                    </table>
                    <div class="mt-4">
                        <a href="/backend/api/documents/download.php?id=${doc.id}" target="_blank" class="btn btn-primary px-4">
                            <i class="bi bi-download me-1"></i> Download File
                        </a>
                    </div>
                `;

                // Render shared list
                const sharedList = document.getElementById('sharedList');
                sharedList.innerHTML = '';
                if (doc.shared_with && doc.shared_with.length > 0) {
                    doc.shared_with.forEach(access => {
                        const entity = access.role_name ? `Role: ${access.role_name}` : `User: ${access.user_email}`;
                        const permBadge = access.permission === 'VIEW_DOWNLOAD' ? 'bg-success' : 'bg-secondary';
                        
                        sharedList.innerHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <strong class="d-block mb-1">${entity}</strong>
                                    <span class="badge ${permBadge} fw-normal">${access.permission}</span>
                                </div>
                                <button class="btn btn-sm btn-outline-danger px-3 py-1" onclick="revokeAccess(${access.access_id})">Revoke</button>
                            </li>
                        `;
                    });
                } else {
                    sharedList.innerHTML = '<li class="list-group-item text-muted py-3">Not shared with anyone.</li>';
                }
            } else {
                document.getElementById('docDetailContent').innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
            }
        } catch (err) {
            document.getElementById('docDetailContent').innerHTML = '<div class="alert alert-danger">Error loading document.</div>';
        }
    }

    async function revokeAccess(accessId) {
        if (confirm('Revoke this access?')) {
            try {
                const res = await apiDelete(`/backend/api/documents/access.php?id=${docId}&access_id=${accessId}`);
                if (res.success) {
                    showToast('Success', 'Access revoked', 'success');
                    loadDocumentDetail();
                } else {
                    showToast('Error', res.message, 'error');
                }
            } catch(err) {
                showToast('Error', 'Error revoking access', 'error');
            }
        }
    }
  </script>
</body>
</html>
