<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGI ERP - Shared Documents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
</head>
<body>
  <div id="app-wrapper">
    <!-- Sidebar -->
    <aside id="app-sidebar"></aside>

    <!-- Main Section -->
    <div id="app-main">
      <!-- Top Header Navbar -->
      <header id="app-header"></header>

      <!-- App Content Container -->
      <main class="app-content">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div>
            <h4 class="fw-bold text-dark mb-0">Shared Documents</h4>
          </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body d-flex gap-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search Document...">
                <select id="categoryFilter" class="form-select w-25">
                    <option value="">All Categories</option>
                    <option value="Agreement">Agreement</option>
                    <option value="Contract">Contract</option>
                    <option value="Policy">Policy</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Document Name</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Shared By</th>
                                <th>Shared Date</th>
                                <th class="pe-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="documentTableBody">
                            <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Document Preview Modal -->
  <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="previewTitle">Document Detail</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0" id="previewBody">
           Loading...
        </div>
        <div class="modal-footer" id="previewFooter">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../utils/roles.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/loading.js"></script>
  <script src="../../components/sidebar.js"></script>
  <script src="../../components/header.js"></script>
  
  <script>
    let currentUser = null;
    
    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await checkAuth();
        if (!currentUser) return;
        
        renderSidebar('shared_documents', currentUser);
        renderHeader(currentUser);
        
        await loadDocuments();

        document.getElementById('searchInput').addEventListener('input', debounce(loadDocuments, 500));
        document.getElementById('categoryFilter').addEventListener('change', loadDocuments);
    });

    async function loadDocuments() {
        const tbody = document.getElementById('documentTableBody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Loading...</td></tr>';
        
        const search = document.getElementById('searchInput').value;
        const category = document.getElementById('categoryFilter').value;
        
        try {
            const res = await apiGet(`/backend/api/documents/overview.php?search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}`);
            if (res.success) {
                tbody.innerHTML = '';
                if (res.data.items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No shared documents found.</td></tr>';
                    return;
                }
                
                res.data.items.forEach(doc => {
                    const date = new Date(doc.shared_date).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4"><strong>${doc.name}</strong></td>
                            <td><span class="badge bg-secondary">${doc.category}</span></td>
                            <td><span class="badge bg-light text-dark border">${doc.file_extension.toUpperCase()}</span></td>
                            <td>${doc.shared_by_email}</td>
                            <td>${date}</td>
                            <td class="pe-4">
                                <button class="btn btn-sm btn-outline-primary" onclick="openPreview('${doc.id}')">View</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                throw new Error(res.message);
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${err.message || 'Failed to load documents.'}</td></tr>`;
        }
    }

    async function openPreview(docId) {
        const modal = new bootstrap.Modal(document.getElementById('previewModal'));
        modal.show();
        const body = document.getElementById('previewBody');
        const footer = document.getElementById('previewFooter');
        
        body.innerHTML = '<div class="text-center my-4"><div class="spinner-border text-primary"></div></div>';
        footer.innerHTML = '<button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>';

        try {
            const res = await apiGet(`/backend/api/documents/detail.php?id=${docId}`);
            if (res.success) {
                const doc = res.data;
                const sizeMb = (doc.file_size / (1024 * 1024)).toFixed(2);
                const isPdf = doc.file_extension.toLowerCase() === 'pdf';
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(doc.file_extension.toLowerCase());
                const viewUrl = `/backend/api/documents/view.php?id=${doc.id}`;
                
                let viewerHtml = '';
                if (isPdf) {
                    viewerHtml = `
                        <div class="border-top bg-light" style="height: 600px;">
                            <iframe src="${viewUrl}#toolbar=0" style="width: 100%; height: 100%; border: none;"></iframe>
                        </div>
                    `;
                } else if (isImage) {
                    viewerHtml = `
                        <div class="border-top p-3 text-center bg-light" style="max-height: 600px; overflow-y: auto;">
                            <img src="${viewUrl}" alt="${doc.name}" class="img-fluid rounded shadow-sm" style="max-height: 550px;">
                        </div>
                    `;
                } else {
                    viewerHtml = `
                        <div class="border-top p-4 text-center bg-light">
                            <i class="bi bi-file-earmark-text text-muted fs-1 mb-2 d-block"></i>
                            <p class="text-muted mb-0">Preview is not available for .${doc.file_extension.toUpperCase()} files.</p>
                        </div>
                    `;
                }

                body.innerHTML = `
                    <div class="p-3 bg-white">
                        <div class="row g-2 small">
                            <div class="col-sm-6">
                                <span class="text-muted">Kategori:</span> <strong class="text-dark">${doc.category}</strong>
                            </div>
                            <div class="col-sm-6">
                                <span class="text-muted">Tipe & Ukuran:</span> <strong class="text-dark">${doc.file_extension.toUpperCase()} (${sizeMb} MB)</strong>
                            </div>
                            <div class="col-sm-6">
                                <span class="text-muted">Deskripsi:</span> <span class="text-dark">${doc.description || '-'}</span>
                            </div>
                            <div class="col-sm-6">
                                <span class="text-muted">Izin Anda:</span> 
                                <span class="badge ${doc.my_permission === 'VIEW_DOWNLOAD' ? 'bg-success' : 'bg-primary'}">${doc.my_permission === 'VIEW' ? 'View Only' : doc.my_permission}</span>
                            </div>
                        </div>
                    </div>
                    ${viewerHtml}
                `;

                if (doc.my_permission === 'VIEW_DOWNLOAD' || doc.my_permission === 'OWNER') {
                    footer.innerHTML += `
                        <a href="/backend/api/documents/download.php?id=${doc.id}" target="_blank" class="btn btn-primary">
                            <i class="bi bi-download me-1"></i> Download File
                        </a>
                    `;
                } else {
                    footer.innerHTML += `
                        <button class="btn btn-outline-secondary" disabled title="Akses dokumen ini hanya untuk melihat">
                            <i class="bi bi-lock me-1"></i> Download (Tidak Diizinkan)
                        </button>
                    `;
                }
            } else {
                body.innerHTML = `<div class="p-4 text-center text-danger">${res.message}</div>`;
            }
        } catch (err) {
            body.innerHTML = '<div class="p-4 text-center text-danger">Error loading document details.</div>';
        }
    }

    function debounce(func, timeout = 300){
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }
  </script>
</body>
</html>
