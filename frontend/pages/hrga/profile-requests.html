<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGI ERP - Profile Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
</head>
<body>
  <div id="app-wrapper">
    <aside id="app-sidebar"></aside>

    <div id="app-main">
      <header id="app-header"></header>

      <main class="app-content">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div>
            <h4 class="fw-bold text-dark mb-0">Profile Change Requests</h4>
            <p class="text-muted mb-0">Review and approve employee profile updates.</p>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Employee</th>
                                <th>Requested At</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="requestTableBody">
                            <tr>
                                <td colspan="4" class="text-center py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
          <div class="modal-content border-0 shadow">
              <div class="modal-header border-bottom">
                  <h5 class="modal-title fw-bold">Review Profile Change</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body p-4">
                  <div class="d-flex align-items-center gap-3 mb-4">
                      <div id="reqUserAvatar" class="bg-light rounded-circle d-flex align-items-center justify-content-center text-secondary fw-bold" style="width:50px; height:50px; font-size:1.2rem;">?</div>
                      <div>
                          <h6 class="fw-bold mb-0" id="reqUserName">Employee Name</h6>
                          <small class="text-muted" id="reqUserEmail">email@domain.com</small>
                      </div>
                  </div>
                  
                  <h6 class="fw-bold mb-3 border-bottom pb-2">Requested Changes</h6>
                  <div class="table-responsive mb-4">
                      <table class="table table-bordered table-sm align-middle">
                          <thead class="table-light">
                              <tr>
                                  <th>Field</th>
                                  <th>Old Value</th>
                                  <th>New Value</th>
                              </tr>
                          </thead>
                          <tbody id="changesTableBody"></tbody>
                      </table>
                  </div>
                  
                  <div id="rejectSection" class="d-none">
                      <div class="mb-3">
                          <label class="form-label fw-bold text-danger">Reason for Rejection *</label>
                          <textarea id="rejectReason" class="form-control" rows="3" placeholder="Enter reason..."></textarea>
                      </div>
                      <div class="d-flex justify-content-end gap-2">
                          <button class="btn btn-light border" onclick="toggleRejectSection(false)">Cancel</button>
                          <button class="btn btn-danger" onclick="submitDecision('reject')">Confirm Reject</button>
                      </div>
                  </div>
                  
              </div>
              <div class="modal-footer bg-light" id="actionFooter">
                  <button type="button" class="btn btn-outline-danger" onclick="toggleRejectSection(true)">Reject</button>
                  <button type="button" class="btn btn-success px-4" onclick="submitDecision('approve')">Approve Changes</button>
              </div>
          </div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/sidebar.js"></script>
  <script src="../../components/header.js"></script>

  <script>
    let currentUser = null;
    let reviewModal = null;
    let currentRequestId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await checkAuth();
        if (!currentUser || ![2, 7].includes(currentUser.role_id)) {
            window.location.href = getAppUrl('/frontend/dashboard.html');
            return;
        }
        
        renderSidebar('profile_requests', currentUser);
        renderHeader(currentUser);
        
        reviewModal = new bootstrap.Modal(document.getElementById('reviewModal'));
        loadRequests();
    });

    async function loadRequests() {
        const tbody = document.getElementById('requestTableBody');
        try {
            const res = await apiGet('/backend/api/hrga/profile-requests.php');
            if (res.success) {
                if (res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">No pending requests</td></tr>';
                    return;
                }
                
                tbody.innerHTML = res.data.map(req => `
                    <tr>
                        <td class="ps-4">
                            <h6 class="mb-0 fw-bold">${req.name || '<i>Unnamed</i>'}</h6>
                            <small class="text-muted">${req.email}</small>
                        </td>
                        <td>${req.requested_at}</td>
                        <td><span class="badge bg-warning text-dark border">PENDING</span></td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-primary" onclick="openReview(${req.id})">Review</button>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">Failed to load</td></tr>`;
        }
    }
    
    async function openReview(id) {
        currentRequestId = id;
        toggleRejectSection(false);
        document.getElementById('changesTableBody').innerHTML = '<tr><td colspan="3" class="text-center">Loading...</td></tr>';
        reviewModal.show();
        
        try {
            const res = await apiGet('/backend/api/hrga/profile-requests.php?id=' + id);
            if (res.success) {
                const req = res.data;
                document.getElementById('reqUserName').innerText = req.name || 'Unnamed';
                document.getElementById('reqUserEmail').innerText = req.email;
                document.getElementById('reqUserAvatar').innerText = (req.name || 'U').charAt(0).toUpperCase();
                
                let rows = '';
                req.items.forEach(item => {
                    let oldV = item.old_value || '-';
                    let newV = item.new_value || '-';
                    
                    if (item.field_name === 'photo') {
                        oldV = item.old_file ? `<a href="/backend/api/profile/photo.php?id=${req.user_id}" target="_blank">View Old</a>` : 'No Photo';
                        newV = `<a href="/backend/storage/${item.new_file}" target="_blank">View New Upload</a>`;
                    }
                    
                    rows += `
                        <tr>
                            <td class="fw-bold">${capitalizeFirst(item.field_name)}</td>
                            <td class="text-muted">${oldV}</td>
                            <td class="fw-bold text-success">${newV}</td>
                        </tr>
                    `;
                });
                
                document.getElementById('changesTableBody').innerHTML = rows;
            }
        } catch (err) {
            document.getElementById('changesTableBody').innerHTML = '<tr><td colspan="3" class="text-center text-danger">Failed to load detail</td></tr>';
        }
    }
    
    function toggleRejectSection(show) {
        const rejectSec = document.getElementById('rejectSection');
        const footer = document.getElementById('actionFooter');
        
        if (show) {
            rejectSec.classList.remove('d-none');
            footer.classList.add('d-none');
            document.getElementById('rejectReason').value = '';
        } else {
            rejectSec.classList.add('d-none');
            footer.classList.remove('d-none');
        }
    }
    
    async function submitDecision(action) {
        let payload = null;
        if (action === 'reject') {
            const reason = document.getElementById('rejectReason').value;
            if (!reason.trim()) {
                alert('Reason is required');
                return;
            }
            payload = { reason: reason };
        }
        
        try {
            const res = await apiPost(`/backend/api/hrga/profile-requests.php?id=${currentRequestId}&action=${action}`, payload);
            if (res.success) {
                showToast('Success', res.message, 'success');
                reviewModal.hide();
                loadRequests();
            } else {
                showToast('Error', res.message, 'error');
            }
        } catch (err) {
            showToast('Error', err.message, 'error');
        }
    }
    
    function capitalizeFirst(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }
  </script>
</body>
</html>
