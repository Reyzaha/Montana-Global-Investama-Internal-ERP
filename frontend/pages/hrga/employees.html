<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGI ERP - Employee Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
</head>
<body>
  <div id="app-wrapper">
    <aside id="app-sidebar"></aside>

    <div id="app-main">
      <header id="app-header"></header>

      <main class="app-content">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div>
            <h4 class="fw-bold text-dark mb-0">Employee Management</h4>
            <p class="text-muted mb-0">Manage all employees master data and documents.</p>
          </div>
          <!-- <div>
            <button class="btn btn-primary" onclick="showToast('Info', 'Use the admin panel to add users', 'info')">
                <i class="bi bi-person-plus me-1"></i> Add Employee
            </button>
          </div> -->
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body d-flex gap-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name or email...">
                <select id="statusFilter" class="form-select w-25">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="suspended">Suspended</option>
                </select>
                <button class="btn btn-primary" onclick="loadEmployees(1)">Filter</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Employee</th>
                                <th>Role</th>
                                <th>Position</th>
                                <th>Join Date</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top p-3 d-flex justify-content-between align-items-center" id="paginationContainer">
                <small class="text-muted" id="pageInfo">Showing 0 of 0</small>
                <div class="btn-group" id="paginationBtns"></div>
            </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/sidebar.js"></script>
  <script src="../../components/header.js"></script>

  <script>
    let currentUser = null;
    let currentPage = 1;

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await checkAuth();
        if (!currentUser || ![2, 7].includes(currentUser.role_id)) {
            window.location.href = getAppUrl('/frontend/dashboard.html');
            return;
        }
        
        renderSidebar('hrga_employees', currentUser);
        renderHeader(currentUser);
        
        loadEmployees(1);
    });

    async function loadEmployees(page) {
        currentPage = page;
        const search = document.getElementById('searchInput').value;
        const status = document.getElementById('statusFilter').value;
        
        const tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Loading...</td></tr>';
        
        try {
            const res = await apiGet(`/backend/api/hrga/employees.php?page=${page}&limit=10&search=${search}&status=${status}`);
            if (res.success) {
                renderTable(res.data.data);
                renderPagination(res.data.meta);
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">${res.message}</td></tr>`;
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Failed to load</td></tr>`;
        }
    }
    
    function renderTable(data) {
        const tbody = document.getElementById('employeeTableBody');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">No employees found</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(emp => {
            const statusBadge = emp.status === 'active' ? 'bg-success' : (emp.status === 'inactive' ? 'bg-secondary' : 'bg-danger');
            
            return `
                <tr>
                    <td class="ps-4">
                        <div class="d-flex align-items-center gap-3">
                            <img src="/backend/api/profile/photo.php?id=${emp.id}" class="rounded-circle object-fit-cover" width="40" height="40" onerror="this.src='/frontend/assets/images/default-avatar.png'">
                            <div>
                                <h6 class="mb-0 fw-bold">${emp.name || '<i>Unnamed</i>'}</h6>
                                <small class="text-muted">${emp.email}</small>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge bg-light text-dark border">${emp.role_name}</span></td>
                    <td>${emp.position || '-'}</td>
                    <td>${emp.join_date || '-'}</td>
                    <td><span class="badge ${statusBadge}">${emp.status}</span></td>
                    <td class="text-end pe-4">
                        <a href="/frontend/pages/hrga/employee-detail.html?id=${emp.id}" class="btn btn-sm btn-light border">
                            <i class="bi bi-eye"></i> View
                        </a>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    function renderPagination(meta) {
        document.getElementById('pageInfo').innerText = `Total: ${meta.total} employees | Page ${meta.page} of ${meta.total_pages}`;
        
        const btns = document.getElementById('paginationBtns');
        let html = '';
        
        if (meta.page > 1) {
            html += `<button class="btn btn-sm btn-outline-secondary" onclick="loadEmployees(${meta.page - 1})">Prev</button>`;
        } else {
            html += `<button class="btn btn-sm btn-outline-secondary" disabled>Prev</button>`;
        }
        
        if (meta.page < meta.total_pages) {
            html += `<button class="btn btn-sm btn-outline-secondary" onclick="loadEmployees(${meta.page + 1})">Next</button>`;
        } else {
            html += `<button class="btn btn-sm btn-outline-secondary" disabled>Next</button>`;
        }
        
        btns.innerHTML = html;
    }
  </script>
</body>
</html>
