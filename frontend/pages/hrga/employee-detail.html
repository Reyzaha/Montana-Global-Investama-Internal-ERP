<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGI ERP - Employee Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
</head>
<body>
  <div id="app-wrapper">
    <aside id="app-sidebar"></aside>

    <div id="app-main">
      <header id="app-header"></header>

      <main class="app-content">
        <div class="d-flex align-items-center mb-4 gap-3">
            <a href="/frontend/pages/hrga/employees.html" class="btn btn-light border btn-sm">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <h4 class="fw-bold text-dark mb-0">Employee Detail</h4>
        </div>

        <ul class="nav nav-tabs mb-4" id="employeeTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="master-tab" data-bs-toggle="tab" data-bs-target="#master-pane" type="button" role="tab">Master Data</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="docs-tab" data-bs-toggle="tab" data-bs-target="#docs-pane" type="button" role="tab">Official Documents</button>
            </li>
        </ul>

        <div class="tab-content" id="employeeTabsContent">
            <!-- Master Data Tab -->
            <div class="tab-pane fade show active" id="master-pane" role="tabpanel">
                <div class="row">
                    <div class="col-md-3 mb-4">
                        <div class="card border-0 shadow-sm text-center">
                            <div class="card-body py-4">
                                <img id="empImage" src="/frontend/assets/images/default-avatar.png" class="rounded-circle mb-3 object-fit-cover" width="120" height="120" alt="Profile">
                                <h6 class="fw-bold mb-1" id="empNameDisp">-</h6>
                                <p class="text-muted small mb-0" id="empEmailDisp">-</p>
                                <span class="badge bg-light text-dark border mt-2" id="empRoleDisp">-</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-9">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-4">
                                <form id="empForm">
                                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                                        <h5 class="fw-bold mb-0">Basic Information</h5>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Name *</label>
                                            <input type="text" class="form-control" id="empName" name="name" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Gender</label>
                                            <select class="form-select" id="empGender" name="gender">
                                                <option value="">-- Select --</option>
                                                <option value="LAKI-LAKI">Laki-Laki</option>
                                                <option value="PEREMPUAN">Perempuan</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Birth Place</label>
                                            <input type="text" class="form-control" id="empBirthPlace" name="birth_place">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Birth Date</label>
                                            <input type="date" class="form-control" id="empBirthDate" name="birth_date">
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-muted">Address *</label>
                                        <textarea class="form-control" id="empAddress" name="address" rows="2" required></textarea>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Phone Number</label>
                                            <input type="text" class="form-control" id="empPhone" name="phone">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Marital Status *</label>
                                            <select class="form-select" id="empMarital" name="marital_status" required>
                                                <option value="">-- Select --</option>
                                                <option value="LAJANG">Lajang</option>
                                                <option value="MENIKAH">Menikah</option>
                                                <option value="CERAI">Cerai</option>
                                            </select>
                                        </div>
                                    </div>

                                    <h5 class="fw-bold mb-3 border-bottom pb-2 mt-4">Job & Identity</h5>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Position / Jabatan</label>
                                            <input type="text" class="form-control" id="empPosition" name="position">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">Join Date</label>
                                            <input type="date" class="form-control" id="empJoinDate" name="join_date">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">NO KTP *</label>
                                            <input type="text" class="form-control" id="empKtp" name="ktp_no" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-muted">NO KK *</label>
                                            <input type="text" class="form-control" id="empKk" name="kk_no" required>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="submit" class="btn btn-primary px-4" id="btnSaveMaster">Save Master Data</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Documents Tab -->
            <div class="tab-pane fade" id="docs-pane" role="tabpanel">
                <div class="row">
                    <!-- Photo -->
                    <div class="col-md-6 mb-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h6 class="fw-bold mb-3">Profile Photo (Pas Foto)</h6>
                                <div class="d-flex align-items-center gap-3">
                                    <img id="docPhotoImg" src="/frontend/assets/images/default-avatar.png" width="80" height="80" class="rounded object-fit-cover">
                                    <div class="flex-grow-1">
                                        <form class="upload-form" data-type="photo">
                                            <input type="file" class="form-control form-control-sm mb-2" accept="image/jpeg,image/png,image/webp" required>
                                            <button type="submit" class="btn btn-sm btn-outline-primary">Upload Photo</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- KTP -->
                    <div class="col-md-6 mb-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h6 class="fw-bold mb-3">Dokumen KTP</h6>
                                <div id="docKtpStatus" class="mb-2 text-muted small"><i class="bi bi-x-circle text-danger"></i> Not uploaded</div>
                                <form class="upload-form" data-type="ktp">
                                    <input type="file" id="ktpFile" class="form-control form-control-sm mb-2" accept=".pdf,image/jpeg,image/png" required>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Upload KTP</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- KK -->
                    <div class="col-md-6 mb-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h6 class="fw-bold mb-3">Dokumen Kartu Keluarga</h6>
                                <div id="docKkStatus" class="mb-2 text-muted small"><i class="bi bi-x-circle text-danger"></i> Not uploaded</div>
                                <form class="upload-form" data-type="kk">
                                    <input type="file" class="form-control form-control-sm mb-2" accept=".pdf,image/jpeg,image/png" required>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Upload KK</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Ijazah -->
                    <div class="col-md-6 mb-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h6 class="fw-bold mb-3">Ijazah Terakhir</h6>
                                <div id="docIjazahStatus" class="mb-2 text-muted small"><i class="bi bi-x-circle text-danger"></i> Not uploaded</div>
                                <form class="upload-form" data-type="ijazah">
                                    <input type="file" class="form-control form-control-sm mb-2" accept=".pdf,image/jpeg,image/png" required>
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Upload Ijazah</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/sidebar.js"></script>
  <script src="../../components/header.js"></script>

  <script>
    let currentUser = null;
    const urlParams = new URLSearchParams(window.location.search);
    const empId = urlParams.get('id');

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await checkAuth();
        if (!currentUser || ![2, 7].includes(currentUser.role_id)) {
            window.location.href = getAppUrl('/frontend/dashboard.html');
            return;
        }
        
        renderSidebar('hrga_employees', currentUser);
        renderHeader(currentUser);
        
        if (!empId) {
            alert('No employee ID');
            window.location.href = getAppUrl('/frontend/pages/hrga/employees.html');
            return;
        }
        
        await loadEmployeeData();

        document.getElementById('empForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSaveMaster');
            btn.disabled = true;
            btn.innerHTML = 'Saving...';
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const res = await apiPatch(`/backend/api/hrga/employee-detail.php?id=${empId}`, data);
                if (res.success) {
                    showToast('Success', 'Master data saved', 'success');
                    loadEmployeeData();
                } else {
                    showToast('Error', res.message, 'error');
                }
            } catch(err) {
                showToast('Error', err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Save Master Data';
            }
        });

        document.querySelectorAll('.upload-form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = form.querySelector('button');
                btn.disabled = true;
                btn.innerText = 'Uploading...';
                
                const type = form.dataset.type;
                const file = form.querySelector('input[type="file"]').files[0];
                
                const formData = new FormData();
                formData.append('user_id', empId);
                formData.append('doc_type', type);
                formData.append('file', file);
                
                try {
                    const res = await apiUpload('/backend/api/hrga/employee-documents.php', formData);
                    if (res.success) {
                        showToast('Success', 'Document uploaded', 'success');
                        form.reset();
                        loadEmployeeData();
                    } else {
                        showToast('Error', res.message, 'error');
                    }
                } catch(err) {
                    showToast('Error', err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Upload ' + type.toUpperCase();
                }
            });
        });
    });

    async function loadEmployeeData() {
        try {
            const res = await apiGet(`/backend/api/hrga/employee-detail.php?id=${empId}`);
            if (res.success) {
                const emp = res.data;
                
                // Top display
                document.getElementById('empNameDisp').innerText = emp.name || emp.email;
                document.getElementById('empEmailDisp').innerText = emp.email;
                // document.getElementById('empRoleDisp').innerText = 'Employee'; // if we want role name, need to join in backend
                if (emp.photo_path) {
                    const pic = `/backend/api/profile/photo.php?id=${empId}&t=${Date.now()}`;
                    document.getElementById('empImage').src = pic;
                    document.getElementById('docPhotoImg').src = pic;
                }
                
                // Form
                document.getElementById('empName').value = emp.name || '';
                document.getElementById('empGender').value = emp.gender || '';
                document.getElementById('empBirthPlace').value = emp.birth_place || '';
                if(emp.birth_date) document.getElementById('empBirthDate').value = emp.birth_date;
                document.getElementById('empAddress').value = emp.address || '';
                document.getElementById('empPhone').value = emp.phone || '';
                document.getElementById('empMarital').value = emp.marital_status || '';
                document.getElementById('empPosition').value = emp.position || '';
                if(emp.join_date) document.getElementById('empJoinDate').value = emp.join_date;
                document.getElementById('empKtp').value = emp.ktp_no || '';
                document.getElementById('empKk').value = emp.kk_no || '';
                
                // Doc status
                updateDocStatus('docKtpStatus', emp.ktp_doc_path, 'ktp');
                updateDocStatus('docKkStatus', emp.kk_doc_path, 'kk');
                updateDocStatus('docIjazahStatus', emp.ijazah_doc_path, 'ijazah');
            }
        } catch(err) {}
    }
    
    function updateDocStatus(elId, path, docType) {
        const el = document.getElementById(elId);
        if (path) {
            el.innerHTML = `
                <div class="d-flex align-items-center justify-content-between">
                    <span class="text-success"><i class="bi bi-check-circle-fill"></i> Uploaded</span>
                    <a href="/backend/api/profile/document.php?id=${empId}&type=${docType}" target="_blank" class="btn btn-sm btn-outline-info">
                        <i class="bi bi-eye"></i> Lihat Dokumen
                    </a>
                </div>
            `;
        } else {
            el.innerHTML = `<i class="bi bi-x-circle text-danger"></i> Not uploaded`;
        }
    }

  </script>
</body>
</html>
