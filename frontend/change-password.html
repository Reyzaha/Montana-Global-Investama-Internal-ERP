<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganti Kata Sandi Wajib - MGI ERP</title>

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1e3a8a">

  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="p-4 p-sm-5">
      <!-- Header -->
      <div class="text-center mb-4">
        <div class="brand-icon-box mb-3">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Ganti Kata Sandi Wajib</h4>
        <p class="text-muted small mb-0">Montana Global Investama ERP</p>
      </div>

      <!-- Security Notice Alert -->
      <div class="alert alert-warning border-0 d-flex gap-2 align-items-start p-3 mb-4 rounded-3 small">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-5 flex-shrink-0 mt-0"></i>
        <div>
          <strong>Login Pertama / Reset Terdeteksi</strong><br>
          Demi keamanan akun korporasi Anda, silakan buat kata sandi baru pribadi sebelum melanjutkan ke sistem.
        </div>
      </div>

      <!-- Error / Validation Alert -->
      <div id="alertBox" class="alert alert-danger d-none small p-2 mb-3" role="alert"></div>

      <!-- Form -->
      <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
        <!-- Current Password -->
        <div class="mb-3">
          <label for="currentPassword" class="form-label small fw-semibold text-secondary">
            Kata Sandi Awal / Saat Ini <span class="text-danger">*</span>
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control" id="currentPassword" placeholder="Masukkan kata sandi awal" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('currentPassword', 'eyeCurrent')">
              <i class="bi bi-eye" id="eyeCurrent"></i>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label for="newPassword" class="form-label small fw-semibold text-secondary">
            Kata Sandi Baru <span class="text-danger">*</span>
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="newPassword" placeholder="Minimal 8 karakter" minlength="8" required autocomplete="new-password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('newPassword', 'eyeNew')">
              <i class="bi bi-eye" id="eyeNew"></i>
            </button>
          </div>
          <div class="form-text small text-muted">Minimal 8 karakter, tidak boleh sama dengan kata sandi lama.</div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label for="confirmPassword" class="form-label small fw-semibold text-secondary">
            Konfirmasi Kata Sandi Baru <span class="text-danger">*</span>
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Ulangi kata sandi baru" minlength="8" required autocomplete="new-password">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('confirmPassword', 'eyeConfirm')">
              <i class="bi bi-eye" id="eyeConfirm"></i>
            </button>
          </div>
          <div id="matchText" class="small mt-1 d-none"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          <span id="btnText">Simpan Kata Sandi & Lanjutkan</span>
          <i class="bi bi-arrow-right" id="btnIcon"></i>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="bg-light px-4 py-3 text-center border-top">
      <a href="javascript:void(0)" onclick="handleLogout()" class="text-muted small text-decoration-none">
        <i class="bi bi-box-arrow-left me-1"></i> Batal & Keluar
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="components/toast.js"></script>

  <script>
    // Live validation match check
    const newPassEl = document.getElementById('newPassword');
    const confirmPassEl = document.getElementById('confirmPassword');
    const matchTextEl = document.getElementById('matchText');

    function checkPassMatch() {
      const p1 = newPassEl.value;
      const p2 = confirmPassEl.value;
      if (!p2) {
        matchTextEl.classList.add('d-none');
        return;
      }
      matchTextEl.classList.remove('d-none');
      if (p1 === p2) {
        matchTextEl.textContent = '✓ Kata sandi cocok';
        matchTextEl.className = 'small mt-1 text-success fw-semibold';
      } else {
        matchTextEl.textContent = '✗ Konfirmasi kata sandi tidak cocok';
        matchTextEl.className = 'small mt-1 text-danger fw-semibold';
      }
    }

    newPassEl.addEventListener('input', checkPassMatch);
    confirmPassEl.addEventListener('input', checkPassMatch);

    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const current_password = document.getElementById('currentPassword').value;
      const new_password = newPassEl.value;
      const confirm_password = confirmPassEl.value;

      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');

      if (new_password !== confirm_password) {
        alertBox.textContent = 'Konfirmasi kata sandi baru tidak sesuai.';
        alertBox.classList.remove('d-none');
        confirmPassEl.focus();
        return;
      }

      if (new_password.length < 8) {
        alertBox.textContent = 'Kata sandi baru minimal harus 8 karakter.';
        alertBox.classList.remove('d-none');
        newPassEl.focus();
        return;
      }

      if (current_password === new_password) {
        alertBox.textContent = 'Kata sandi baru tidak boleh sama dengan kata sandi lama.';
        alertBox.classList.remove('d-none');
        newPassEl.focus();
        return;
      }

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Menyimpan...';
      btnIcon.classList.add('d-none');

      try {
        const res = await apiPost('/backend/api/auth/change-password.php', {
          current_password,
          new_password,
          confirm_password
        });

        if (res.success) {
          showToast('Kata sandi berhasil diperbarui! Mengalihkan ke Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = getAppUrl(res.data?.redirect || '/frontend/dashboard.html');
          }, 800);
        } else {
          alertBox.textContent = res.message || 'Gagal mengubah kata sandi.';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          btnSpinner.classList.add('d-none');
          btnText.textContent = 'Simpan Kata Sandi & Lanjutkan';
          btnIcon.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = 'Terjadi kesalahan sistem. Silakan coba lagi.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.textContent = 'Simpan Kata Sandi & Lanjutkan';
        btnIcon.classList.remove('d-none');
      }
    }

    async function handleLogout() {
      try {
        await apiPost('/backend/api/auth/logout.php', {});
      } catch (e) {}
      localStorage.removeItem('mgi_user');
      window.location.href = getAppUrl('/frontend/login.html');
    }
  </script>
</body>

</html>
