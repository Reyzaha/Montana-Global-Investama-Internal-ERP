<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi OTP - MGI ERP / HRIS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Global Theme -->
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .mfa-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #0f2042 0%, #080f20 90%);
      padding: 1.5rem;
    }
    .mfa-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      background-color: #ffffff;
      overflow: hidden;
    }
    .otp-input {
      letter-spacing: 0.5em;
      font-size: 1.6rem;
      text-align: center;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="mfa-container">
    <div class="mfa-card">
      <div class="card-header bg-light border-bottom p-4 text-center">
        <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
          <i class="bi bi-shield-check fs-3"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Two-Factor Authentication</h4>
        <p class="text-muted small mb-0">Masukkan kode keamanan Google Authenticator</p>
      </div>

      <div class="card-body p-4">
        <!-- Error Alert -->
        <div id="mfaAlert" class="alert alert-danger d-none small p-2 mb-3" role="alert"></div>

        <form id="verifyOtpForm" onsubmit="handleVerifyOtp(event)">
          <div class="mb-3 text-center">
            <label for="otpInput" class="form-label small fw-semibold text-secondary">6-Digit Authenticator Code</label>
            <input type="text" class="form-control otp-input" id="otpInput" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus autocomplete="one-time-code">
            <div class="form-text small mt-2">Buka aplikasi Google Authenticator untuk melihat kode.</div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            <span id="btnText">Verifikasi & Lanjutkan</span>
            <i class="bi bi-arrow-right" id="btnIcon"></i>
          </button>
        </form>
      </div>

      <div class="card-footer bg-light text-center py-3 border-top">
        <a href="/frontend/login.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Kembali ke Login</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="components/toast.js"></script>
  <script>
    const otpInputEl = document.getElementById('otpInput');
    // Batasi input HANYA angka dan maksimal 6 digit
    otpInputEl.addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    async function handleVerifyOtp(e) {
      e.preventDefault();
      const otp = otpInputEl.value.trim();
      const alertBox = document.getElementById('mfaAlert');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');

      if (otp.length !== 6) {
        alertBox.textContent = 'Kode OTP harus tepat 6 digit angka.';
        alertBox.classList.remove('d-none');
        otpInputEl.focus();
        return;
      }

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Memverifikasi...';
      btnIcon.classList.add('d-none');

      const res = await apiPost('/backend/api/auth/verify-otp.php', { otp });

      submitBtn.disabled = false;
      btnSpinner.classList.add('d-none');
      btnText.textContent = 'Verifikasi & Lanjutkan';
      btnIcon.classList.remove('d-none');

      if (res.success) {
        showToast('Verifikasi berhasil! Mengalihkan ke Dashboard...', 'success');
        setTimeout(() => {
          window.location.href = getAppUrl(res.data.redirect || '/frontend/dashboard.html');
        }, 600);
      } else {
        alertBox.textContent = res.message || 'Kode OTP tidak valid atau telah kedaluwarsa.';
        alertBox.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
